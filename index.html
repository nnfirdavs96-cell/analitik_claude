<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>RackMap — цифровая серверная</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg:      '#0D1117',
        card:    '#161B22',
        card2:   '#1C2129',
        border:  '#30363D',
        accent:  '#3B82F6',
        ok:      '#22C55E',
        warn:    '#EAB308',
        crit:    '#EF4444',
        muted:   '#8B949E',
        text:    '#E6EDF3',
      },
      fontFamily: {
        sans: ['Inter','system-ui','sans-serif'],
        mono: ['JetBrains Mono','ui-monospace','monospace'],
      }
    }
  }
}
</script>
<style>
  html,body { background:#0D1117; color:#E6EDF3; font-family:Inter, system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .scrollbar::-webkit-scrollbar { width:8px; height:8px; }
  .scrollbar::-webkit-scrollbar-thumb { background:#30363D; border-radius:4px; }
  .scrollbar::-webkit-scrollbar-track { background:transparent; }
  .dot-grid {
    background-image: radial-gradient(#1f2733 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .glow-ok    { box-shadow: 0 0 0 1px #22C55E33, 0 0 22px -4px #22C55E80; }
  .glow-warn  { box-shadow: 0 0 0 1px #EAB30833, 0 0 22px -4px #EAB30880; }
  .glow-crit  { box-shadow: 0 0 0 1px #EF444433, 0 0 22px -4px #EF444480; }
  .led { width:6px; height:6px; border-radius:99px; display:inline-block; }
  .port { width:14px; height:14px; border-radius:3px; display:inline-block; }
  .port.active { background:#3B82F6; box-shadow: inset 0 0 0 1px #60A5FA; }
  .port.empty  { background:#30363D; }
  .port.err    { background:#EF4444; box-shadow: inset 0 0 0 1px #FCA5A5; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity:.35 } }
  .u-slot { border-top:1px dashed #21262d; }
  .tab-active { color:#E6EDF3; background:#1C2129; border:1px solid #30363D; }
  .tab { color:#8B949E; border:1px solid transparent; }
  .tab:hover { color:#E6EDF3; }
  .btn { border:1px solid #30363D; background:#1C2129; color:#E6EDF3; }
  .btn:hover { border-color:#3B82F6; }
  .btn-primary { background:#3B82F6; border:1px solid #3B82F6; color:white; }
  .btn-primary:hover { background:#2563EB; }
  .chip { border:1px solid #30363D; background:#0D1117; color:#8B949E; }
  .field { background:#0D1117; border:1px solid #30363D; color:#E6EDF3; }
  .field:focus { outline:none; border-color:#3B82F6; }
  .tooltip {
    position:fixed; z-index:80; pointer-events:none;
    background:#0D1117; border:1px solid #30363D; border-radius:8px;
    padding:10px 12px; min-width:220px;
    box-shadow: 0 12px 40px rgba(0,0,0,.6);
    font-size:12px;
  }
  .divider { height:1px; background:#21262d; }
  .kbd { border:1px solid #30363D; background:#0D1117; padding:0 6px; border-radius:4px; font-size:11px; color:#8B949E; }
  .gauge { --v:60; --c:#22C55E;
    width:64px; height:64px; border-radius:99px;
    background: conic-gradient(var(--c) calc(var(--v)*1%), #21262d 0);
    display:grid; place-items:center; position:relative;
  }
  .gauge::after {
    content:""; position:absolute; inset:6px; border-radius:99px; background:#161B22;
  }
  .gauge > span { position:relative; z-index:1; font-size:12px; color:#E6EDF3; }
  .spark { width:100%; height:36px; }
  .row-hover:hover { background:#1C2129; }
  .cable-blue   { stroke:#3B82F6; }
  .cable-gray   { stroke:#8B949E; }
  .cable-yellow { stroke:#EAB308; }
  .node { fill:#161B22; stroke:#30363D; stroke-width:1; }
  .node.selected { stroke:#3B82F6; stroke-width:2; filter: drop-shadow(0 0 8px #3B82F680); }
  .node-label { fill:#E6EDF3; font-family:Inter; font-size:11px; }
  .node-sub   { fill:#8B949E; font-family:'JetBrains Mono'; font-size:10px; }
  .link { transition: stroke-opacity .2s; }
  .link.dim { stroke-opacity:.12; }
  .modal-back { background: rgba(2,6,12,.65); backdrop-filter: blur(4px); }
  details > summary { list-style:none; cursor:pointer; }
  details > summary::-webkit-details-marker { display:none; }
  .sev-info { color:#8B949E; }
  .sev-warn { color:#EAB308; }
  .sev-crit { color:#EF4444; }
</style>
</head>
<body class="min-w-[1440px]">
<!-- See branch for full source; identical to local index.html -->
<script>document.body.innerHTML='<div style="padding:40px;font-family:Inter">Loading — pull latest and open index.html locally.</div>';</script>
</body>
</html>
